name: Build KeePassXC (ROR, Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout KeePassXC (PR #12971, Related Origin Requests)
        uses: actions/checkout@v4
        with:
          repository: keepassxreboot/keepassxc
          ref: 19e2ff307a5a27ad55e56ebc9ad61ea445931629
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-libbotan
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-argon2
            mingw-w64-x86_64-qrencode

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DKPXC_FEATURE_DOCS=OFF

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build -j"$(nproc)"
          # Build the proxy explicitly so it cannot be skipped by the default target
          cmake --build build --target keepassxc-proxy -j"$(nproc)"

      - name: Package portable build
        shell: msys2 {0}
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          cp build/src/keepassxc.exe dist/

          PROXY=$(find build -type f -iname 'keepassxc-proxy*.exe' | head -n 1)
          CLI=$(find build -type f -iname 'keepassxc-cli*.exe' | head -n 1)
          echo "proxy: ${PROXY:-NOT FOUND}"
          echo "cli:   ${CLI:-NOT FOUND}"

          if [ -z "$PROXY" ]; then
            echo "ERROR: keepassxc-proxy.exe was not built. Candidates in build tree:"
            find build -iname '*proxy*' | head -n 50 || true
            exit 1
          fi
          cp "$PROXY" dist/
          if [ -n "$CLI" ]; then cp "$CLI" dist/; fi

          DEPLOYQT=$(command -v windeployqt || command -v windeployqt6)
          "$DEPLOYQT" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist/keepassxc.exe

          # Copy every non-system DLL imported by the binaries/plugins.
          # objdump is part of binutils and is far more reliable here than ldd.
          for i in 1 2 3 4 5; do
            before=$(find dist -type f | wc -l)
            for f in $(find dist -type f \( -name '*.exe' -o -name '*.dll' \)); do
              for name in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name:/{print $3}'); do
                if [ ! -f "dist/$name" ] && [ -f "/mingw64/bin/$name" ]; then
                  cp "/mingw64/bin/$name" "dist/$name"
                fi
              done
            done
            after=$(find dist -type f | wc -l)
            echo "dependency pass $i: $before -> $after files"
            if [ "$before" = "$after" ]; then break; fi
          done

          for d in share translations wordlists; do
            if [ -d "build/$d" ]; then cp -r "build/$d" dist/; fi
          done

          # Hard verification: proxy present and all MinGW deps resolvable from dist
          if [ ! -f dist/keepassxc-proxy.exe ]; then
            echo "ERROR: dist/keepassxc-proxy.exe missing"
            exit 1
          fi

          missing=0
          for f in dist/keepassxc.exe dist/keepassxc-proxy.exe; do
            for name in $(objdump -p "$f" | awk '/DLL Name:/{print $3}'); do
              if [ -f "/mingw64/bin/$name" ] && [ ! -f "dist/$name" ]; then
                echo "MISSING DEPENDENCY: $name (needed by $f)"
                missing=1
              fi
            done
          done
          if [ "$missing" != "0" ]; then
            exit 1
          fi

          echo "--- dist contents ---"
          ls -la dist

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KeePassXC-ROR-win64
          path: dist
          if-no-files-found: error

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath KeePassXC-ROR-win64.zip -CompressionLevel Optimal

      - name: Publish as release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ror-build-${{ github.run_number }}" KeePassXC-ROR-win64.zip \
            --title "KeePassXC ROR (PR #12971) build ${{ github.run_number }}" \
            --notes "Temporary portable Windows build with Related Origin Requests support (KeePassXC PR #12971). Unsigned binary, built from source in GitHub Actions." \
            --prerelease
